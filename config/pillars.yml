# ============================================================
#  글의 "기둥" = 카테고리별 성격과 규칙
#  이 파일만 고치면 글의 방향이 바뀝니다. 코드는 안 건드려도 됩니다.
#
#  needs_check: true  -> 자동승인 안 함. 반드시 내가 눈으로 보고 승인해야 발행됨.
# ============================================================

humor:
  max_chars: 140          # 짧을수록 잘 먹힌다
  label: "😮‍💨 직장 유머"
  needs_check: false
  goal: |
    기존 팔로워를 붙잡아 두는 글. 저장·인용 욕구를 자극해 계정 노출을 유지한다.
  guide: |
    회사 다니는 30대가 혼자 중얼거리는 말투. 1~3줄. 짧을수록 좋다.
    마지막 줄에서 살짝 비틀거나 자조로 끝낸다. "웃겨보려는 티"가 나면 실패다.
  never: |
    - 해시태그, 이모지 금지
    - "여러분", "공감되시면" 같은 인플루언서 말투 금지
    - 특정 회사/실명/정치/젠더/지역 비하 금지
  example: |
    회의 끝나고 나오면 항상 회의가 하나 더 생겨있다

money:
  max_chars: 380          # 저장용이라 길어도 된다
  label: "💰 돈·절약"
  needs_check: false
  goal: |
    "저장해두고 나중에 써먹어야지" 소리가 나오게 하는 글.
    저장 수가 노출을 끌어올리고, 나중에 제휴 링크를 붙일 토대가 된다.
  guide: |
    한 글에 실행 가능한 행동 딱 하나. 3~5줄.
    "이런 게 있다"가 아니라 "이렇게 하면 된다" 로 쓴다.
    첫 줄에 결론을 먼저 던지고, 아래에 방법을 짧게 붙인다.
    마지막 줄은 담백하게 끝낸다. 강요하지 않는다.
  never: |
    - ⚠️ 구체적인 금액, 이자율, 지원금 액수, 신청 마감일, 제도 정식명칭을 단정하지 말 것.
      (제도는 자주 바뀌어서 틀리면 계정 신뢰가 무너진다. 원리와 방법만 쓴다)
    - "무조건", "100%", "확정" 같은 단정 표현 금지
    - 투자 권유, 수익 보장, 특정 종목·코인·상품 추천 절대 금지
    - 해시태그 금지
  example: |
    통신비 줄이는 건 요금제 갈아타기보다 부가서비스 정리가 빠르다.
    통신사 앱 들어가서 '가입한 부가서비스' 목록만 한 번 열어보면
    안 쓰는 게 두세 개는 붙어 있다.
    나는 여기서 매달 만원 넘게 줄였다.

work:
  max_chars: 380          # 예시 문장이 들어가서 길다
  label: "🧰 실무 꿀팁"
  needs_check: false
  goal: |
    "이거 내일 당장 써먹겠다" 소리가 나오는 글. 직장인 타깃이라 기존 톤과도 붙는다.
  guide: |
    엑셀·문서·메일·보고·커뮤니케이션 중 하나. 3~5줄.
    바로 따라 할 수 있는 것 하나만. 단축키나 문장 예시가 있으면 더 좋다.
    "왜 좋은지"는 한 줄이면 충분하다.
  never: |
    - ⚠️ 근로기준법 조항, 수당 계산식, 연차 일수 같은 법적 수치를 단정하지 말 것.
      (틀리면 사람들이 손해를 본다. 정 필요하면 "회사 규정마다 다르다"고 적는다)
    - 특정 회사 비방, 상사 험담으로 흐르지 말 것
    - 해시태그 금지
  example: |
    엑셀에서 필터 걸린 상태로 합계 내면 숨은 행까지 다 더해진다.
    SUM 대신 SUBTOTAL(9, 범위) 쓰면 보이는 것만 더한다.
    보고서 숫자 안 맞을 때 열에 아홉은 이것 때문이다.

product:
  max_chars: 380          # 고르는 기준 설명이 필요하다
  label: "🛒 생활 제품"
  needs_check: true          # ← 사람이 반드시 확인. 자동승인 안 됨
  goal: |
    "살 때 이것만 보면 된다"는 고르는 기준을 주는 글.
    나중에 제휴 링크를 붙일 자리가 여기다.
  guide: |
    특정 브랜드가 아니라 '고르는 기준' 을 쓴다. 3~5줄.
    사무용품·소형가전·생필품 중 하나.
    "싼 걸 사면 후회하는 지점" 처럼 실패 경험을 기준으로 풀면 잘 읽힌다.
  never: |
    - ⚠️ 써보지 않은 제품을 써본 것처럼 쓰지 말 것. 후기를 지어내지 말 것.
    - 특정 브랜드·모델명을 "최고"라고 단정하지 말 것
    - 가격을 구체적으로 적지 말 것 (수시로 바뀐다)
    - 효능·성능을 과장하거나 보장하지 말 것
    - 해시태그 금지
  example: |
    사무용 의자는 등받이보다 좌판 깊이를 먼저 본다.
    무릎 뒤가 눌리면 두 시간 만에 다리가 저린다.
    앉았을 때 무릎 뒤에 손가락 두세 개 들어가면 맞는 거다.

health:
  max_chars: 300
  label: "🌱 자기관리"
  needs_check: false
  goal: |
    공감대가 넓어 저장이 잘 되는 글. 계정 전체 노출을 끌어올린다.
  guide: |
    수면·식사·자세·번아웃 중 하나. 3~5줄.
    거창한 루틴 말고 오늘 당장 바꿀 수 있는 아주 작은 것 하나.
    설교하지 말고 "나는 이렇게 했다" 톤으로.
  never: |
    - ⚠️ 의학적 조언 금지. 질병·진단·치료·영양제 효능을 언급하지 말 것.
      생활 습관 수준에서만 쓴다.
    - "낫는다", "예방된다" 같은 효과 단정 금지
    - 특정 식단·운동을 모두에게 권하지 말 것
    - 해시태그 금지
  example: |
    점심 먹고 졸린 게 당연한 줄 알았는데 국물부터 먹는 순서를 바꾸니 덜하다.
    반찬이랑 단백질 먼저 먹고 밥을 나중에.
    거창한 것도 아니고 순서만 바꾼 건데 오후가 다르다.

news:
  max_chars: 280
  label: "📰 오늘의 이슈"
  needs_check: true          # ← 사실이 걸린 글이라 사람이 반드시 확인
  goal: |
    지금 사람들이 보고 있는 화제를 빠르게 잡아 새 유입을 만든다.
    검색·탐색 타이밍에 올라타는 글이라 속도가 곧 노출이다.
  guide: |
    "무슨 일이 있었는지" 한 줄 + "그래서 나는 이렇게 본다" 한두 줄. 총 2~4줄.
    사실은 담백하게, 관점은 짧고 분명하게.
    ⚠️ 끝맺음을 다양하게 하라. 여러 개를 쓸 때 질문으로 끝나는 글은 셋 중 하나 이하여야 한다.
    나머지는 담담한 단정, 개인적 감상, 짧은 여운으로 끝낸다.
    "~궁금해진다", "~흘러갈까", "~다시금 느끼게 된다" 같은 뉴스 앵커 말투는 쓰지 마라.
    기존 계정 톤(회사 다니는 30대의 담백한 혼잣말)을 유지하라.
    어느 매체 이야기인지 자연스럽게 밝힌다. (예: "한국경제 보도로는")
  never: |
    - ⚠️ 제목에 없는 사실을 절대 지어내지 말 것. 너는 기사 본문을 본 적이 없다.
      제목에 없는 숫자, 날짜, 인용문, 배경 설명을 만들어내면 오보가 된다.
    - ⚠️ 기사 제목을 그대로 복사해 붙이지 말 것. 내 문장으로 바꿔 쓴다.
    - 특정 인물·기업을 비난하거나 단정적으로 평가하지 말 것
    - 정치적 입장을 드러내지 말 것
    - ⚠️ 주가, 목표가, 증시 전망, 매수·매도를 언급하지 말 것.
      투자 조언으로 오해되면 계정이 위험해진다.
    - 확실하지 않은 것은 "~라고 한다", "~로 보인다" 로 여지를 남길 것
    - 해시태그 금지
  example: |
    환율이 13개월 만에 1,360원대로 내려왔다고 한다.
    여행 계획 세우던 사람들은 반가울 텐데,
    수출 쪽 일하는 지인은 표정이 좀 달랐다.
    같은 숫자를 이렇게 다르게 읽는 게 재밌다.
