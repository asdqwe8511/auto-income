# ============================================================
#  블로그 글쓰기 봇 설정. 여기만 고치면 됩니다.
# ============================================================

# ⚠️ 글을 쓰는 사람이 누구인지. "아빠" 또는 "엄마".
#    모든 글의 1인칭 시점이 여기서 정해집니다.
화자: 엄마

아이:
  첫째: { 나이: 8, 소속: 초등학교 1학년 }
  둘째: { 나이: 6, 소속: 유치원 }

# 검색형 경험 포스팅 규격 (계획 문서와 같은 값)
규격:
  최소글자수: 1500        # 공백 제외 기준
  소주제개수: 4
  문체: "~했어요"
  태그개수: 5

# 사진에서 한글이 보이면 가립니다.
모자이크:
  켜기: true
  방식: auto              # auto = easyocr 있으면 그것, 없으면 Gemini 비전
  여백: 6                 # 검출 영역 바깥으로 더 칠할 픽셀
  세기: 18                # 클수록 더 뭉갬

# 상호명을 주면 장소 사실을 채웁니다(카카오 지도 API).
장소:
  켜기: true
  # 지도에서 확인되지 않는 항목은 비워둡니다. 절대 추측해서 쓰지 않습니다.
  직접확인항목: [주차, 최대수용인원, 대기여부]

# 구글 상위 글의 '구성'을 참고합니다. 문장과 사실은 가져오지 않습니다.
벤치마킹:
  켜기: true

출력폴더: data/blog
