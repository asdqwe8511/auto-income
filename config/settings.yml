# ============================================================
#  여기 숫자만 바꾸면 시스템 동작이 바뀝니다. 코드는 안 건드려도 됩니다.
# ============================================================

timezone: Asia/Seoul

# 승인 버튼을 누르면 예정 시간을 기다리지 않고 바로 발행합니다.
# false 로 하면 예정 시간까지 기다립니다.
publish_on_approve: true

# 알림 후 이 시간(분) 동안 아무 버튼도 안 누르면 → 자동으로 승인되어 발행됩니다.
# (근무 중 텔레그램 못 볼 때를 위한 안전장치. 0 으로 하면 자동승인 끔)
auto_approve_after_minutes: 180

# 하루에 몇 시에 텔레그램 알림을 보낼지
slots:
  morning: "07:00"
  lunch:   "12:00"
  evening: "20:00"

channels:
  x:
    enabled: true
    max_chars: 400           # X 프리미엄이라 길게 써도 됩니다 (카테고리별 상한은 pillars.yml)
    slots: { morning: 4, lunch: 3, evening: 3 }   # 하루 10개
    publish_gap_minutes: 25                        # 같은 슬롯 글끼리 벌리는 간격
    daily_publish_cap: 12                          # 안전장치(무료 API 한도 보호)
    # 하루 10개를 어떤 글로 채울지. 합계가 위 slots 합계(10)와 같아야 합니다.
    # 카테고리 성격은 config/pillars.yml 에서 고칩니다.
    mix:
      news: 4       # 실시간 이슈 -> 새 유입 (사람 확인 필요)
      humor: 3      # 기존 팔로워 유지
      money: 2      # 저장 유도 + 나중에 제휴 링크 자리
      product: 1    # 사람 확인 필요
  threads:
    enabled: false           # X 부터 자리잡은 뒤에 켭니다
    max_chars: 400
    slots: { morning: 1, lunch: 1, evening: 1 }    # 하루 3개
    publish_gap_minutes: 60
    daily_publish_cap: 5
    mix:
      humor: 1
      money: 1
      health: 1

# 과거 글과 이만큼 비슷하면 버리고 다시 뽑습니다 (0~1, 높을수록 관대)
similarity_threshold: 0.72
history_days: 60

# ============ 글을 써주는 AI 엔진 ============
# provider 한 줄만 바꾸면 엔진이 통째로 바뀝니다. (모델도 같이 바꿔주세요)
#   gemini : 무료. 카드 등록 불필요. 하루 250~1,500회 무료  ← 추천
#            (이 시스템은 하루 2~4번만 호출하므로 무료로 충분합니다)
#   claude : 유료(월 약 1만2천원). 한국어 글맛이 가장 좋음.
llm:
  provider: gemini
  model: gemini-3.6-flash    # 안 되면 자동으로 다른 모델로 넘어갑니다 (claude 라면 -> claude-opus-5)
  temperature: 1.0
  effort: low                # claude 일 때만 쓰이는 옵션

# ============ 카드뉴스 이미지 ============
# 텔레그램으로 사진을 보내면 아래 설정대로 카드 이미지를 만들어 줍니다.
card:
  enabled: true
  size: 1080                  # 정사각형 한 변 크기(px)
  gradient_start: 0.42        # 화면 위에서 몇 %부터 어두워질지
  gradient_strength: 0.90     # 맨 아래 어둡기 (0~1)
  accent_rgb: [255, 210, 60]  # 문구 왼쪽 포인트 막대 색
  footer: ""                  # 이미지 하단 작은 글씨 (예: "@내계정" 또는 사이트 주소)
  headline_max_chars: 24      # 사진에 얹을 대표 문구 최대 길이

  # ---- AI 사진 생성 (Gemini 이미지 모델) ----
  # 켜면: 글에 어울리는 사진을 AI가 만들고, 그 위에 한글 문구를 얹습니다.
  # 끄면: 글자만 있는 그라데이션 카드가 만들어집니다.
  # 주의: 이미지 생성은 글 생성보다 무료 한도가 훨씬 적습니다.
  #       한도를 넘으면 자동으로 글자 카드로 넘어갑니다.

  # 사진을 안 붙여도 글만으로 카드 이미지를 자동 생성합니다.
  # 100% 직접 만든 이미지라 저작권 문제가 없고, 이미지가 붙으면 X 노출이 올라갑니다.
  auto_generate: true

# ============ AI 사진 생성 ============
image:
  # 무료 티어에는 이미지 모델이 없습니다(항상 429). 결제를 붙이면 true 로 바꾸세요.
  # false 여도 🖼 버튼을 누르면 Flow 에 붙여넣을 프롬프트는 그대로 나옵니다.
  enabled: false
  model: gemini-3-pro-image   # 안 되면 자동으로 다른 이미지 모델을 시도합니다
  max_per_day: 6              # 하루 최대 몇 장까지 만들지 (무료 한도 보호)
  pillars:                    # 이 카테고리에만 AI 사진을 씁니다 (비우면 전체)
    - news
    - money
    - product

# ============ 영상 가공 ============
# 세로 영상: 아래쪽에 어두운 띠 + 문구
# 가로 영상: 위아래 검은 여백에 아이디(위) + 문구(아래)
video:
  enabled: true
  width: 1080
  max_seconds: 140            # X 무료 계정 영상 길이 한도에 맞춤
  keep_audio: true

# ============ 실시간 뉴스 글감 ============
# 내 news-ranking 사이트에서 화제 기사 '제목'만 가져와 글감으로 씁니다.
# 기사 본문·사진·영상은 절대 가져오지 않습니다 (저작권 침해 + X 정책 위반).
news:
  url: "https://asdqwe8511.github.io/news-ranking/news.json"
  min_comments: 5             # 이보다 댓글 적으면 화제성 부족으로 제외

  # 카테고리별로 어떤 뉴스 섹션을 글감으로 쓸지
  sections:
    news:    ["생활/문화", "IT/과학", "경제"]
    money:   ["재테크", "부동산"]
    health:  ["건강", "요리"]
    product: ["리빙", "패션/뷰티", "자동차", "여행"]

  # 이 섹션은 통째로 제외 (계정 성격이 바뀌고 논란·신고 위험이 큽니다)
  block_sections: ["정치", "사회", "세계", "기타"]

